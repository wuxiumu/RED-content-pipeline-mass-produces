# 主题词族表 · 03 的生产工单来源
# 顺序 = 儿童认知常见度排产优先级(运营人工维护,不靠 LLM)
# slot: 主体插槽文案,替换 base_style.txt 中的【SUBJECT];只描述造型/颜色/配件,
#       五官/四肢/草地/天空由 base_style 统一提供,严禁在 slot 里要求文字或字母

families:
  - id: fruits
    zh: 水果
    priority: 1
    words:
      - {en: apple,   zh: 苹果,   slot: "拟人化红苹果,圆滚滚,果皮红色带浅黄色高光,头顶短果柄和一片绿色小叶子"}
      - {en: banana,  zh: 香蕉,   slot: "拟人化黄香蕉,弯弯的月牙形,表皮明黄色,顶端有褐色小蒂"}
      - {en: orange,  zh: 橙子,   slot: "拟人化橙子,圆球形,橙色果皮带浅色小凹点,头顶一片绿叶"}
      - {en: grape,   zh: 葡萄,   slot: "拟人化一串紫葡萄,十几颗圆润紫色小球挤在一起,顶部有绿色藤蔓和叶子"}
      - {en: strawberry, zh: 草莓, slot: "拟人化草莓,红色心形果实,表面有浅黄色小籽,头顶绿色萼片像小帽子"}
      - {en: watermelon, zh: 西瓜, slot: "拟人化西瓜,圆滚滚绿色外皮带深绿色波浪条纹,切开一小角露出红色瓜瓤和黑色瓜子"}
      - {en: pear,    zh: 梨,     slot: "拟人化梨,上窄下宽的葫芦形,浅黄绿色果皮,带褐色小果柄和嫩叶"}
      - {en: peach,   zh: 桃子,   slot: "拟人化水蜜桃,心形圆润,粉白粉橘渐变果皮,头顶一道浅沟和绿叶"}
      - {en: pineapple, zh: 菠萝, slot: "拟人化菠萝,椭圆形金黄色果身带菱形格纹,头顶一丛绿色剑形叶冠"}
      - {en: lemon,   zh: 柠檬,   slot: "拟人化柠檬,椭圆形明黄色,两端有小小的凸起,一片绿叶"}
      - {en: cherry,  zh: 樱桃,   slot: "拟人化一对红樱桃,两颗圆滚滚红色小球紧挨在一起,共用一根绿色细柄"}
      - {en: mango,   zh: 芒果,   slot: "拟人化芒果,饱满的肾形,红黄渐变果皮,带一片绿叶"}

  - id: animals
    zh: 动物
    priority: 2
    words:
      - {en: dog,    zh: 小狗,  slot: "拟人化小狗,浅棕色圆头,耷拉的耳朵,黑色圆鼻头,脸颊浅白,短短的卷尾巴"}
      - {en: cat,    zh: 小猫,  slot: "拟人化小猫,橘黄色,三角形耳朵带粉色内耳,几根胡须,长尾巴卷起来"}
      - {en: rabbit, zh: 兔子,  slot: "拟人化小白兔,两只长长的耳朵带粉色内耳,圆圆的短尾巴,门牙露出一点点"}
      - {en: bear,   zh: 小熊,  slot: "拟人化小熊,棕色圆耳朵圆身体,浅米色口鼻,圆鼓鼓的肚子"}
      - {en: pig,    zh: 小猪,  slot: "拟人化小猪,粉红色,大圆鼻子有两个鼻孔,三角形耳朵,卷卷的细尾巴"}
      - {en: duck,   zh: 鸭子,  slot: "拟人化小黄鸭,嫩黄色绒毛,橘黄色扁嘴巴,橘色小蹼脚"}
      - {en: chick,  zh: 小鸡,  slot: "拟人化小鸡,嫩黄色圆绒球身体,橙色小尖嘴和细腿"}
      - {en: cow,    zh: 奶牛,  slot: "拟人化奶牛,白色身体带不规则黑色斑块,粉色大鼻子,两只小犄角"}
      - {en: sheep,  zh: 绵羊,  slot: "拟人化小绵羊,米白色蓬松卷毛像一团棉花,浅灰色小脸和短腿"}
      - {en: frog,   zh: 青蛙,  slot: "拟人化小青蛙,翠绿色,头顶两只凸起的圆眼睛,白色肚皮"}
      - {en: elephant, zh: 大象, slot: "拟人化小象,浅灰色,长鼻子向上卷起,两把大耳朵像扇子"}
      - {en: lion,   zh: 狮子,  slot: "拟人化小狮子,橘金色,脑袋周围一圈蓬松鬃毛像太阳,尾巴尖有一撮毛"}
      - {en: monkey, zh: 猴子,  slot: "拟人化小猴子,棕色,浅米色圆脸盘,长尾巴卷成小圈"}
      - {en: panda,  zh: 熊猫,  slot: "拟人化小熊猫,白色圆身体,黑色耳朵和椭圆形黑眼圈,黑色四肢"}
      - {en: fish,   zh: 小鱼,  slot: "拟人化小丑鱼,橙色身体带两条白色竖纹,在水草和气泡之间"}

  - id: food
    zh: 食物
    priority: 3
    words:
      - {en: egg,      zh: 鸡蛋,   slot: "拟人化鸡蛋,椭圆形白色蛋壳,一头微微裂开露出一点黄色"}
      - {en: milk,     zh: 牛奶,   slot: "拟人化牛奶盒,白底蓝条纹的方形纸盒,顶部插着一根吸管", uncountable: true}
      - {en: bread,    zh: 面包,   slot: "拟人化小面包,金黄色椭圆形吐司,表面有烤纹,软软的感觉", uncountable: true}
      - {en: cake,     zh: 蛋糕,   slot: "拟人化小蛋糕,粉色奶油三层圆蛋糕,顶上一颗红樱桃和一根蜡烛"}
      - {en: cookie,   zh: 饼干,   slot: "拟人化曲奇饼干,圆形金黄色,表面嵌着几颗深褐色巧克力豆"}
      - {en: icecream, zh: 冰淇淋, slot: "拟人化冰淇淋,粉白双色圆球叠在黄色脆皮蛋筒上,头顶一颗小樱桃"}
      - {en: carrot,   zh: 胡萝卜, slot: "拟人化胡萝卜,橙色锥形,表面有浅横纹,头顶一丛绿色叶子"}
      - {en: corn,     zh: 玉米,   slot: "拟人化玉米,金黄色玉米棒颗粒整齐,裹着几片绿色外皮", uncountable: true}
      - {en: tomato,   zh: 番茄,   slot: "拟人化番茄,正红色圆球形,光滑反光,头顶绿色星形萼片"}
      - {en: cheese,   zh: 奶酪,   slot: "拟人化奶酪,明黄色三角块,表面有几个圆圆的洞", uncountable: true}

  - id: vehicles
    zh: 交通工具
    priority: 4
    words:
      - {en: car,    zh: 小汽车, slot: "拟人化红色小轿车,圆润的甲壳虫造型,两个圆圆的车前灯,两个黑色车轮"}
      - {en: bus,    zh: 公交车, slot: "拟人化黄色校车,方方圆圆的车身,一排浅蓝色车窗,四个黑轮子"}
      - {en: train,  zh: 火车,   slot: "拟人化绿色小火车,圆圆的车头带大烟囱冒出白色小汽团,红色车轮"}
      - {en: plane,  zh: 飞机,   slot: "拟人化白色小飞机,机身带一条蓝色条纹,螺旋桨是四叶的"}
      - {en: ship,   zh: 轮船,   slot: "拟人化小轮船,白色船身红色船底,黄色小烟囱,飘着三角小旗"}
      - {en: bike,   zh: 自行车, slot: "拟人化小自行车,天蓝色车架,两个黑色轮子,车把上一个小车铃"}
      - {en: balloon, zh: 热气球, slot: "拟人化热气球,粉紫渐变的大气球,下面挂着浅黄色小篮子"}
      - {en: boat,   zh: 小船,   slot: "拟人化小帆船,橙色船身,白色船帆鼓起,飘在浅蓝色水波上"}

  - id: body
    zh: 身体部位
    priority: 5
    # 抽象部位用"可爱小熊对应部位特写"承载,避免真人脸
    host: "一只圆脸的棕色卡通小熊"
    words:
      - {en: eye,    zh: 眼睛, slot: "一只超大小熊的圆眼睛特写,黑色豆豆眼珠带白色高光,浅棕色毛发背景"}
      - {en: ear,    zh: 耳朵, slot: "一只小熊的圆耳朵特写,棕色外耳浅粉色内耳"}
      - {en: nose,   zh: 鼻子, slot: "一只小熊的黑色圆鼻头特写,旁边有浅色口鼻毛发"}
      - {en: mouth,  zh: 嘴巴, slot: "一只小熊微笑的嘴巴特写,弯弯的弧线,露出一点点粉色舌头"}
      - {en: hand,   zh: 小手, slot: "一只棕色小熊的圆手套形小手,掌心浅色,四根圆指头"}
      - {en: foot,   zh: 小脚, slot: "一只小熊的圆脚掌特写,棕色脚掌带浅色肉垫"}
      - {en: tooth,  zh: 牙齿, slot: "一颗拟人化白色小牙齿,方方圆圆,带着笑脸,头顶有小牙刷图案点缀"}
      - {en: hair,   zh: 头发, slot: "一撮柔顺的棕色短发造型,卷卷的发梢,放在小熊头顶"}

  - id: colors
    zh: 颜色
    priority: 6
    # 颜色用"圆滚滚的颜料小精灵"承载,避免画面出现文字
    words:
      - {en: red,    zh: 红色, slot: "拟人化红色颜料小精灵,圆滚滚的红色果冻身体,头顶一滴圆润的颜料"}
      - {en: yellow, zh: 黄色, slot: "拟人化黄色颜料小精灵,圆滚滚的明黄色果冻身体"}
      - {en: blue,   zh: 蓝色, slot: "拟人化天蓝色颜料小精灵,圆滚滚的蓝色果冻身体"}
      - {en: green,  zh: 绿色, slot: "拟人化草绿色颜料小精灵,圆滚滚的绿色果冻身体"}
      - {en: orange, zh: 橙色, slot: "拟人化橙色颜料小精灵,圆滚滚的橙色果冻身体,注意与橙子区分,身体是光滑颜料块"}
      - {en: purple, zh: 紫色, slot: "拟人化紫色颜料小精灵,圆滚滚的紫色果冻身体"}
      - {en: pink,   zh: 粉色, slot: "拟人化粉色颜料小精灵,圆滚滚的粉色果冻身体"}
      - {en: black,  zh: 黑色, slot: "拟人化黑色颜料小精灵,圆滚滚的黑色果冻身体,背景用奶白色以保证明亮"}

  - id: numbers
    zh: 数字
    priority: 7
    # 画面禁止出现数字,用"n 个同款小物列队"表达数量;台词照教数字
    draw_note: "分镜用对应数量的同款圆润小物表达(1 朵花、2 只鸭…),画面中不出现阿拉伯数字"
    words:
      - {en: one,   zh: 一, slot: "一朵红色的小花立在草地上"}
      - {en: two,   zh: 二, slot: "两只黄色小鸭子并排站在草地上"}
      - {en: three, zh: 三, slot: "三只粉色小蘑菇在草地上排成一排"}
      - {en: four,  zh: 四, slot: "四只橙色小球散落在草地上"}
      - {en: five,  zh: 五, slot: "五朵彩色小花排成弧形"}
      - {en: six,   zh: 六, slot: "六只白色小绵羊在草地上排队"}
      - {en: seven, zh: 七, slot: "七颗红色小气球飘在草地天空上"}
      - {en: eight, zh: 八, slot: "八只绿色小青蛙蹲在草地上"}
      - {en: nine,  zh: 九, slot: "九颗黄色小星星挂在浅蓝色天空中"}
      - {en: ten,   zh: 十, slot: "十只彩色小蝴蝶飞舞在草地上空"}

  - id: weather
    zh: 天气自然
    priority: 8
    words:
      - {en: sun,    zh: 太阳,   slot: "拟人化太阳,暖黄色圆脸外圈一圈三角形橘色光芒,挂在浅蓝色天空中"}
      - {en: moon,   zh: 月亮,   slot: "拟人化弯月亮,浅黄色月牙带笑脸,挂在深蓝色夜空中,周围有小星星"}
      - {en: star,   zh: 星星,   slot: "拟人化黄色小星星,五个圆润的角,带着笑脸挂在天空"}
      - {en: cloud,  zh: 云朵,   slot: "拟人化白色云朵,几朵棉花糖一样的圆团拼在一起,带着笑脸飘在蓝天"}
      - {en: rain,   zh: 雨,     slot: "拟人化灰色小雨云,落下一排排蓝色圆润小雨滴,雨滴带着小笑脸"}
      - {en: snow,   zh: 雪,     slot: "拟人化白色雪花,六瓣对称的圆润雪花片,带着笑脸从天空飘落"}
      - {en: rainbow, zh: 彩虹,  slot: "一道马卡龙七色的圆润彩虹拱桥横跨天空,两端有笑脸小云朵"}
      - {en: wind,   zh: 风,     slot: "拟人化春风,浅蓝色半透明的流线型小精灵,吹动草地和白色小风车"}

  - id: family
    zh: 家庭成员
    priority: 9
    # 全部用兔子一家承载,避免真人恐怖谷
    host: "一个拟人化兔子家庭"
    words:
      - {en: daddy,  zh: 爸爸, slot: "拟人化兔爸爸,高高的白色兔子,戴蓝色小领结"}
      - {en: mommy,  zh: 妈妈, slot: "拟人化兔妈妈,白色兔子,头上系粉色蝴蝶结,穿浅粉围裙"}
      - {en: baby,   zh: 宝宝, slot: "拟人化兔宝宝,小小的白色兔子,穿黄色连体衣,坐在草地上"}
      - {en: brother, zh: 哥哥, slot: "拟人化兔哥哥,中等身高白色兔子,戴蓝色棒球帽"}
      - {en: sister, zh: 姐姐, slot: "拟人化兔姐姐,中等身高白色兔子,头顶一朵粉色小花"}
      - {en: grandma, zh: 奶奶, slot: "拟人化兔奶奶,白色兔子戴浅紫色头巾和圆眼镜"}

  - id: nature
    zh: 植物自然
    priority: 10
    words:
      - {en: tree,   zh: 树,   slot: "拟人化小树,棕色短树干顶着圆圆的绿色树冠,树冠上有笑脸"}
      - {en: flower, zh: 花,   slot: "拟人化小花,五片粉色花瓣围着黄色圆脸盘,绿色细茎两片叶子"}
      - {en: leaf,   zh: 叶子, slot: "拟人化绿叶子,椭圆形翠绿色叶片,中间浅绿叶脉,带着笑脸"}
      - {en: grass,  zh: 小草, slot: "拟人化小草,三株嫩绿色细长草叶从草地里探出来,带着笑脸"}
      - {en: river,  zh: 小河, slot: "拟人化小河,浅蓝色弯曲水带,白色浪花有笑脸,两岸绿色草地"}
      - {en: mountain, zh: 大山, slot: "拟人化小山,圆润的浅绿色三角形山丘,山顶白色雪帽,带笑脸"}
      - {en: stone,  zh: 石头, slot: "拟人化小石头,圆润的灰色椭圆石块,带豆豆眼和微笑"}
      - {en: mushroom, zh: 蘑菇, slot: "拟人化小蘑菇,红色圆润伞盖带白色圆点,米色短菌柄"}
