  <h2>AI 蜡笔英语启蒙单词卡 · 小红书幼儿英语启蒙内容流水线</h2>
  <p>这是一条面向 2-6 岁宝宝英语启蒙账号的内容生产流水线，为每个启蒙单词产出一整套可直接发布到小红书的物料：4 张 AI 原创蜡笔风插画、9 页 1080×1440 单词闪卡、4 句中英双语逐字台词（如 This is a grape. 这是一个葡萄。）、IPA 音标、生活场景亲子互动话术，以及标题、正文和 8 个话题标签组成的发帖文案，可一键复制。系统只产出本地待发布物料，永远不自动发帖。</p>
  <h3>覆盖词族（10 大词族 100 词）</h3>
  <p>水果系列：apple 苹果、banana 香蕉、grape 葡萄、strawberry 草莓、watermelon 西瓜、pear 梨、peach 桃子、pineapple 菠萝、lemon 柠檬、cherry 樱桃；动物系列：dog 小狗、cat 小猫、rabbit 兔子、bear 小熊、pig 小猪、duck 鸭子、chick 小鸡、cow 奶牛；食物系列：egg 鸡蛋、milk 牛奶、bread 面包、cake 蛋糕（不可数名词自动适配 This is 句式）；交通工具系列：car 小汽车等。</p>
  <h3>九页闪卡结构</h3>
  <p>P1 封面（词族系列+单词英语启蒙）→ P2-P5 四张分镜台词页（英文句子+中文翻译）→ P6 单词与音标页 → P7 亲子互动跟读话术页 → P8 词族合集追更页 → P9 CTA 页。</p>
  <h3>六步生产流水线</h3>
  <ol>
    <li>收集：种子词扩展为长尾词，抓取小红书爆款样本做市场研究；</li>
    <li>判断：规则评分排序，生成选题队列；</li>
    <li>台词分镜：LLM 生成 4 句中英台词、分镜、音标与亲子互动话术；</li>
    <li>AI 生图：百炼文生图，固定蜡笔画风骨架 + 同词稳定 seed，无水印、不扩写，每词 4 张；</li>
    <li>九页排版：Pillow 本地把原图排成 1080×1440 成品卡，零费用；</li>
    <li>发帖文案：LLM 写标题正文，校验 4 句台词与卡面逐字一致，自动补齐 8 个标签。</li>
  </ol>
  <h3>技术栈与合规</h3>
  <p>Python 3.9+、智谱 GLM、阿里云百炼 qwen-image 文生图、Pillow、PHP 只读看板、原生 HTML/CSS/JS；断点续跑、文件型状态机、密钥不入库。所有形象均为 AI 原创，不使用任何第三方卡通 IP，不引导站外交易。</p>
  <p>开源仓库：<a href="https://github.com/wuxiumu/RED-content-pipeline-mass-produces">github.com/wuxiumu/RED-content-pipeline-mass-produces</a>。开启 JavaScript 后可浏览 20 篇待发布成品、九页卡预览与一键复制文案。</p>
